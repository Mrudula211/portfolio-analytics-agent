name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # Replays reference plans, so it needs no API key and catches tool, guard and scorer regressions.
      - run: python evaluate.py --self-test --extended --min-accuracy 1.0

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-agent .
      - name: Container starts and answers without an API key
        run: |
          docker run -d --name agent -p 7860:7860 portfolio-agent
          for attempt in $(seq 1 30); do
            curl -fs http://127.0.0.1:7860/api/health && break
            sleep 1
          done
          curl -fs -X POST http://127.0.0.1:7860/api/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"Sector exposure of Balanced Portfolio"}' | grep -q '"route":"fast_path"'
