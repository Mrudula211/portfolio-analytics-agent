name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      # Exercise the actual production planner with Gemini, cache and demo plans disabled.
      - run: python evaluate.py --local-fallback --min-accuracy 1.0
      # Replays reference plans, so it checks the tool/guard/scorer pipeline, not planner accuracy.
      - run: python evaluate.py --self-test --extended --min-accuracy 1.0

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-agent .
      - name: Container starts and serves the Streamlit app without an API key
        run: |
          docker run -d --name agent -p 7860:7860 portfolio-agent
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:7860/_stcore/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:7860/_stcore/health | grep -q ok
          curl -fs http://127.0.0.1:7860/ | grep -qi "<title>"
          curl -fs -o /dev/null http://127.0.0.1:7860/app/static/figtree-latin.woff2
