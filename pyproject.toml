[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]

# Splitting a word list keeps short vocabularies on one readable line.
ignore = ["SIM905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["portfolio_agent"]
